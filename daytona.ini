# Daytona USA Recompiled PC settings
# Edit this file, then restart the game.

[Display]
# Window size as WxH (host window). game_resolution is the guest
# render resolution; leave it at 1280x720 for authentic output.
resolution = 1920x1080
game_resolution = 1280x720
fullscreen = false
monitor = 0
vsync = true
refresh_rate = 60
letterbox = true
safe_area_x = 100
safe_area_y = 100

[Graphics]
internal_resolution_scale = 1
# off, app, 1, 2, 4, 8, 16
anisotropic_filtering = app
# bilinear is always available. CAS/FSR options depend on SDK build support.
upscaler = bilinear
cas_sharpness = 0.0
fsr_quality = auto
dither = false

[Storage]
cache_path = cache
# Leave empty to use the platform save folder.
user_data_path =

[Diagnostics]
debug_overlay = false
log_level = warn
log_max_files = 5
log_max_file_size_mb = 5
